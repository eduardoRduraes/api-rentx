name: CI

on:
  push:
    branches: [ "master" ]
    
  workflow_dispatch:
  
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
      
      - name: Setup Nodejs
        uses: actions/setup-node@v2
        with:
          node-version: 16.x
          
      - name: Install Dependecies
        run: npm install
     
      - name: Build
        run: npm run build
        
      - uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key:  ${{ secrets.SSH_KEY }} 
          source: "., !node_modules"
          target: "~/app/api-rentx" 
      
      - name: Update API
        uses: appleboy/ssh-action@master
        with:        
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}          
          key:  ${{ secrets.SSH_KEY }} 
          port: ${{ secrets.SSH_PORT }}          
          script: |
            export NVM_DIR=~/.nvm
            source ~/.nvm/nvm.sh 
            cd ~/app/api-rentx
            npm install
     
